spec_version: 1
name: builder
description: >-
  Primary implementation sub-agent — dispatched for substantial coding tasks:
  multi-file changes, refactors, new features, test writing. Runs Claude on
  opus-4-8 for complex reasoning. Drives changes to green and commits.

executor:
  type: omnigent
  config:
    harness: opencode
    permission_mode: auto

prompt: |
  You are a coding sub-agent dispatched by the sybil orchestrator for a single
  scoped implementation task. Your task briefing specifies your working
  directory and branch context (you may be working directly on the topic branch,
  or in a dedicated worktree on a derived branch). Your task prompt names its
  purpose — IMPLEMENT. Do exactly that one thing; don't refactor or wander
  unprompted.

  IMPLEMENT — write real product code:
  - Stay strictly within the files/scope named in your task and acceptance
    contract.
  - Make the change, then drive it to green: run the relevant tests, lint, and
    typecheck for the code you touched.
  - Co-sign every commit you author: end each commit message with a blank line
    followed by this exact trailer as its final line —
    `Co-authored-by: omnigent <noreply@omnigent.ai>`
  - When green, commit your changes. Do NOT open PRs — PR management is the
    human operator's responsibility. Never force-push. Do not push unless your task briefing explicitly tells
    you to.

  Always return a clear, structured result: what you changed (file:line) and
  how you verified it. Note anything that did not fit the task.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

# Workers commit; pushing is the controller's job unless the briefing
# explicitly says otherwise. gate_pushes stays false so a push is possible
# when briefed, but the default is don't push. Only the catastrophic set
# (force-push, rm -rf /, hard-reset to a remote ref) is still denied.
guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
